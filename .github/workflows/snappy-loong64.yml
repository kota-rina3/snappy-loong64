name: snappy-loong64-v7.3.3

on:
  workflow_dispatch:

jobs:
  build:
    name: 编译构建 (loong64)
    runs-on: ubuntu-latest

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 设置 QEMU（loong64 模拟）
      uses: docker/setup-qemu-action@v4

    - name: 在 deepin-loong64 容器中编译
      run: |
        docker run --platform linux/loong64 \
          -v "${{ github.workspace }}:/workspace" \
          -w /workspace \
          linuxdeepin/deepin:crimson-loong64-v1.6.0 \
          bash -c '
            set -e

            BUILD_DIR=./build/snappy773
            mkdir -p "$BUILD_DIR"
            cd "$BUILD_DIR"

            apt update && apt upgrade -y
            apt install -y \
              curl ca-certificates xz-utils file \
              binutils build-essential pkg-config \
              cmake make libsnappy-dev python3-dev python3-pip

            curl -fsSL -o /tmp/snappy.tar.gz \
              "https://github.com/Brooooooklyn/snappy/archive/refs/tags/v7.3.3.tar.gz"
            tar -xzf /tmp/snappy.tar.gz -C /tmp
            mv "/tmp/snappy-7.3.3"/* .
            rm -rf /tmp/snappy.tar.gz /tmp/snappy-7.3.3
            ls -la

            curl -fsSL "https://unofficial-builds.nodejs.org/download/release/v22.21.1/node-v22.21.1-linux-loong64.tar.xz" -o /tmp/node.tar.xz
            tar -xJf /tmp/node.tar.xz -C /usr/local --strip-components=1
            node -v
            npm -v
            
            corepack enable
            corepack prepare yarn@4.9.4 --activate
            yarn --version

            curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --default-toolchain stable --profile minimal \
                      --target loongarch64-unknown-linux-gnu
            . "$HOME/.cargo/env"

            cargo build --target loongarch64-unknown-linux-gnu --verbose || echo "cargo build failed with exit code $?"

            yarn install || {
              echo "=== yarn install failed, dumping build logs ==="
              find /tmp -name "*.log" -exec cat {} \;
              exit 1
            }

            yarn build --target loongarch64-unknown-linux-gnu || {
              echo "=== yarn build failed ==="
              exit 1
            }

            NODE_FILE=$(find . -name "*.node" -type f | head -n 1)
            if [ -z "$NODE_FILE" ]; then
                echo "No .node file found!"
                exit 1
            fi
            echo "Found .node file: $NODE_FILE"
            mkdir -p ./out
            cp "$NODE_FILE" ./out/
            ls -la ./out/
            
          '

    - name: 上传构建产物
      uses: actions/upload-artifact@v4
      with:
        name: snappy-loong64-v7.3.3
        path: ./build/snappy773